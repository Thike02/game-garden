{% extends "base.html" %}
{% block content %}
<section>
  <h1>タグ</h1>
  <p class="muted small">ゲームに自由にタグを付けられます。タグを押すと、編集とゲームの選択ができます。「公開しない」にしたタグは、公開ページにも API にも出ません。</p>
  {% if tags %}
  <div class="actions" style="margin-top: 0">
    {% for t in tags %}
    <a class="tag" href="/tags/{{ t.id }}"
       style="color: {{ t.color }}; text-decoration: none; padding: 2px 12px">
      {{ "🔒 " if not t.is_public }}{{ t.name }} <span class="muted">{{ t.games }}本</span>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <p class="muted">まだタグがありません。</p>
  {% endif %}

  <h2 style="margin-top: 16px">タグを作る</h2>
  <form method="post" action="/tags">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="grid">
      <label class="field">名前<input type="text" name="name" maxlength="30" required placeholder="ストーリークリア"></label>
      <label class="field">色<input type="color" name="color" value="{{ default_tag_color }}"></label>
    </div>
    <div class="actions">
      <label class="small"><input type="checkbox" name="is_public" checked> 公開ページに出す</label>
      <button class="primary">作る</button>
    </div>
  </form>
</section>

{% endblock %}
